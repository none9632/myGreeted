# A matugen config fragment for my-greeter. Append it to
# ~/.config/matugen/config.toml (or drop it in whole, if you do not have a config
# yet) and run:
#
#   matugen image /path/to/wallpaper
#
# The template writes the colours into the working copy; the post-hook then
# distributes the colours and the wallpaper into /usr/share/my-greeter, where the
# greeter can reach them as the `greeter` user — who has no home directory and
# therefore no access to ~.

[config]
reload_apps = false

[templates.my-greeter]
input_path = "~/Projects/myGreeter/packaging/matugen/colors.scss"
output_path = "~/Projects/myGreeter/shared/style/colors.scss"
post_hook = "~/Projects/myGreeter/packaging/matugen/post-hook.sh {{image}}"
