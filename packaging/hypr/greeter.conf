# ── Hyprland for the login screen ─────────────────────────────────────────────
# A separate, minimal config: the compositor is only here to put one layer-shell
# window on screen. No wallpaper, animations, blur or window layouts — the
# greeter draws all of it.
#
# My main config (~/.config/hypr/hyprland.lua) has nothing to do with this: the
# greeter runs as the `greeter` user, who has no access to ~.
#
# Docs: https://wiki.hypr.land/Configuring/

monitor = , preferred, auto, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        # There is nothing to blur: the wallpaper lives inside our own surface,
        # and GTK blurs it itself (see picture.screen-bg in
        # shared/style/_base.scss).
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
}

input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    repeat_rate = 35
    repeat_delay = 300
    follow_mouse = 1
}

cursor {
    hide_on_key_press = false
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland

# The login screen, and the exit right after it. ags quits on its own once the
# login succeeds (see GreeterWindow.tsx), and `dispatch exit` brings this
# Hyprland down — only then does greetd start the chosen session.
exec-once = ags run /usr/share/my-greeter/greeter/app.ts; hyprctl dispatch exit
