# ── Hyprland для экрана входа ─────────────────────────────────────────────────
# Отдельный минимальный конфиг: композитор здесь нужен только чтобы показать
# одно layer-shell окно. Никаких обоев, анимаций, блюра и раскладок окон — всё
# рисует сам greeter.
#
# Мой основной конфиг (~/.config/hypr/hyprland.lua) к этому отношения не имеет:
# greeter работает от пользователя `greeter`, которому ~ недоступен.
#
# Docs: https://wiki.hypr.land/Configuring/

monitor = , preferred, auto, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        # Размывать нечего: обои лежат внутри нашей же поверхности, и GTK
        # размывает их сам (см. picture.screen-bg в shared/style/_base.scss).
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
}

input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    repeat_rate = 35
    repeat_delay = 300
    follow_mouse = 1
}

cursor {
    hide_on_key_press = false
}

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland

# Экран входа и выход следом. ags завершается сам после удачного входа
# (см. GreeterWindow.tsx), а `dispatch exit` гасит этот Hyprland — только после
# этого greetd запускает выбранную сессию.
exec-once = ags run /usr/share/my-greeter/greeter/app.ts; hyprctl dispatch exit
