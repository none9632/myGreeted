# greetd configuration for my-greeter.
#
# packaging/install.sh offers to place this file at /etc/greetd/config.toml; it
# can just as well be copied there by hand.

[terminal]
vt = 1

[default_session]
# Started through start-hyprland, not Hyprland directly: it is the launcher
# Hyprland expects, and without it the compositor puts a warning banner across
# the top of the screen — on a login screen, the first thing anyone sees.
# Everything after -- goes to Hyprland itself.
#
# The session's stdout and stderr are the VT itself, so everything Hyprland and
# ags print scrolls across tty1 in the seconds between the boot messages and the
# login screen. The redirection sends it to a file instead: the screen stays as
# the boot left it until the compositor takes the display, and the output is
# still there to read. Written with `>`, not `>>`, so the file holds the current
# run rather than every boot since installation.
#
# greetd splits this line into words and joins it back before handing it to
# sh(1) (its manual says the command line is run by a shell), so the redirection
# survives — but only because none of it needs quoting. Anything quoted here
# would lose its quotes on the way, see sessionCommand() in
# greeter/services/auth.ts.
#
# A shell runs this line, but the first word of it is not the shell's to resolve:
# greetd looks it up as a program before handing anything over, and what it finds
# is what the shell is given. So an environment variable cannot be set by writing
# it in front of the command, the way one would at a prompt — greetd takes
# `VAR=value` for the program name, fails to find it, resolves it against the
# greeter's home directory and the shell is left with this:
#
#     /bin/sh: line 1: /XDG_CACHE_HOME=/var/cache/my-greeter: No such file...
#
# which is greetd exiting without a session, five times in a row, and systemd
# giving up on it — a machine with no way to log in. The greeter's environment is
# set in hyprland.lua with hl.env instead; see the shader cache there.
command = "start-hyprland -- -c /usr/share/my-greeter/hyprland.lua >/var/cache/my-greeter/session.log 2>&1"
user = "greeter"
